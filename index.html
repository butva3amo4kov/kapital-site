    <script>
      document.addEventListener('submit', async function (event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;

        event.preventDefault();
        event.stopImmediatePropagation();

        const fields = form.querySelectorAll('input, select, textarea');
        const name = fields[0] && fields[0].value.trim();
        const phone = fields[1] && fields[1].value.trim();
        if (!name || !phone) return;

        const submit = form.querySelector('[type="submit"]');
        if (submit) submit.disabled = true;
        try {
          const payload = {
            'access_key': '8fd443c4-8bd4-4034-81d9-63d1ac281aaa',
            'Имя': name,
            'Телефон': phone,
            'Сумма': fields[2] && fields[2].tagName === 'INPUT' ? fields[2].value.trim() : '',
            'Тип залога': form.querySelector('select')?.value || '',
            'Страница': location.href,
            'subject': 'Новая заявка с credit-estate.site',
            'from_name': 'Заявки credit-estate.site'
          };
          const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error('Form submission failed');
          form.innerHTML = '<div class="rounded-xl bg-emerald-50 p-5 text-center text-emerald-900"><p class="font-display font-bold">Заявка принята!</p><p class="mt-1 text-sm text-emerald-700">Специалист свяжется с вами в рабочее время для консультации.</p></div>';
        } catch (error) {
          if (submit) submit.disabled = false;
          alert('Не удалось отправить заявку. Позвоните нам по телефону.');
        }
      }, true);
    </script>

    <script>
      /* Content and legal-links patch for the published static build. */
      (function () {
        const replacements = new Map([
          ['Получить деньги', 'Получить консультацию'],
          ['Консультируем по вопросам залогового кредитования и помогаем подобрать варианты у партнёров.', 'Помогаем с получением залогового кредитования любой сложности'],
          ['Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности', 'Я даю согласие на обработку персональных данных и подтверждаю ознакомление с политикой конфиденциальности'],
          ['Всё, что влияет на стоимость кредитования под залога, — на этой странице и в договоре.', 'Всё, что влияет на стоимость кредитования под залог, — на этой странице и в договоре.'],
          ['Всё, что влияет на стоимость кредитования под залога, — на этой странице и в договоре', 'Всё, что влияет на стоимость кредитования под залог, — на этой странице и в договоре']
        ]);

        function replaceText(node) {
          const walker = document.createTreeWalker(node || document.body, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach(function (textNode) {
            let value = textNode.nodeValue;
            replacements.forEach(function (to, from) { value = value.split(from).join(to); });
            if (value !== textNode.nodeValue) textNode.nodeValue = value;
          });
        }

        function addQuizConsent() {
          document.querySelectorAll('button').forEach(function (button) {
            if (button.textContent.replace(/\s+/g, ' ').trim() !== 'Получить консультацию') return;
            const parent = button.parentElement;
            const consentText = 'Я даю согласие на обработку персональных данных и подтверждаю ознакомление с политикой конфиденциальности';
            /* The build already contains a consent note in some forms. Do not add a second identical note. */
            if (!parent || parent.querySelector('[data-quiz-consent]') || parent.textContent.replace(/\s+/g, ' ').includes(consentText)) return;
            const note = document.createElement('p');
            note.dataset.quizConsent = 'true';
            note.className = 'mt-3 text-center text-xs text-muted-foreground';
            note.textContent = consentText;
            parent.insertBefore(note, button.nextSibling);
          });
        }

        function updateServiceButtons() {
          document.querySelectorAll('a').forEach(function (link) {
            if (link.textContent.replace(/\s+/g, ' ').trim().indexOf('Подробнее') !== -1) {
              link.textContent = 'Оставить заявку';
            }
          });
        }

        function applySitePatch() {
          replaceText();
          addQuizConsent();
          updateServiceButtons();

          if (document.body.dataset.capitalStaticPatchApplied === 'true') return;
          document.body.dataset.capitalStaticPatchApplied = 'true';

          document.querySelectorAll('a').forEach(function (link) {
            const label = link.textContent.replace(/\s+/g, ' ').trim();
            if (label === 'Подробнее') {
              link.childNodes.forEach(function (node) { if (node.nodeType === Node.TEXT_NODE) node.nodeValue = 'Оставить заявку '; });
            }
            if (label === 'Политика конфиденциальности') link.href = './privacy-policy.html';
            if (label === 'Договор оферты') {
              link.href = './personal-data-policy.html';
              link.textContent = 'Политика персональных данных';
            }
          });

          const privacyLink = document.querySelector('a[href="./privacy-policy.html"]');
          const personalDataLink = document.querySelector('a[href="./personal-data-policy.html"]');
          if (privacyLink && personalDataLink && privacyLink.parentElement === personalDataLink.parentElement) {
            privacyLink.parentElement.insertBefore(personalDataLink, privacyLink);
          }

          document.querySelectorAll('p').forEach(function (p) {
            if (p.textContent.includes('Всё, что влияет на стоимость кредитования под залога')) {
              p.textContent = p.textContent.replaceAll('под залога', 'под залог');
            }
          });

          const hero = document.querySelector('#top h1');
          if (hero) hero.textContent = 'Консультация по залоговому кредитованию у партнёра';

          document.querySelectorAll('li, p').forEach(function (element) {
            if (element.textContent.includes('Оставьте заявку на сайте или позвоните нам по номеру +7 (927) 797-33-43')) {
              element.innerHTML = 'Оставьте заявку на сайте или позвоните нам по номеру <a class="underline underline-offset-2" href="tel:+79277973343">+7 (927) 797-33-43</a>';
            }
          });
        }

        document.addEventListener('DOMContentLoaded', function () {
          applySitePatch();
          new MutationObserver(function () { replaceText(); addQuizConsent(); updateServiceButtons(); }).observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
