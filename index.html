    <script>
      document.addEventListener('submit', async function (event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;

        event.preventDefault();
        event.stopImmediatePropagation();

        const fields = form.querySelectorAll('input, select, textarea');
        const name = fields[0] && fields[0].value.trim();
        const phone = fields[1] && fields[1].value.trim();
        if (!name || !phone) return;

        const submit = form.querySelector('[type="submit"]');
        if (submit) submit.disabled = true;
        try {
          const params = new URLSearchParams(location.search);
          const payload = {
            name: name,
            phone: phone,
            amount: fields[2] && fields[2].tagName === 'INPUT' ? fields[2].value.trim() : '',
            collateral: form.querySelector('select')?.value || '',
            page: location.href,
            utm: ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content']
              .map(function (key) { return params.get(key) ? key + '=' + params.get(key) : ''; })
              .filter(Boolean).join('&')
          };
          const response = await fetch('https://amocrm-leads.butva3amo4kov.workers.dev/lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error('Form submission failed');
          form.innerHTML = '<div class="rounded-xl bg-emerald-50 p-5 text-center text-emerald-900"><p class="font-display font-bold">Заявка принята!</p><p class="mt-1 text-sm text-emerald-700">Персональный менеджер перезвонит в течение 15 минут и назовёт точную ставку.</p></div>';
        } catch (error) {
          if (submit) submit.disabled = false;
          alert('Не удалось отправить заявку. Позвоните нам по телефону.');
        }
      }, true);
    </script>
